[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkpj"
version = "1.0.0"
description = "One-command Python project generator with an interactive terminal UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Uzma Bibi" }]
keywords = ["scaffold", "generator", "project", "venv", "cli", "bootstrap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-xdist>=3.5", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/uzmabibidev/mkpj"
Issues = "https://github.com/uzmabibidev/mkpj/issues"

[project.scripts]
mkpj = "mkpj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mkpj = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires network access and installs real packages",
    "heavy: downloads very large packages (PyTorch/CUDA)",
    "extra: optional framework packages (XGBoost and friends)",
    "slow: creates a virtual environment, takes a few seconds",
]
filterwarnings = [
    "error::DeprecationWarning:mkpj.*",
    # Under pytest-xdist the worker process has communication threads, so the
    # stdlib's pty.fork() warns about fork safety. The child execve()s right
    # after forking, which is the pattern that warning exists to steer you to.
    "ignore:This process .* is multi-threaded:DeprecationWarning:pty",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
